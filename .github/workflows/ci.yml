name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # golangci-lint must match the version in the Makefile / .golangci.yml.
      # Installed via brew for consistency with local dev (brew install golangci-lint).
      - name: Install golangci-lint
        run: brew install golangci-lint

      - name: golangci-lint
        run: golangci-lint run ./...

  test:
    name: Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...
