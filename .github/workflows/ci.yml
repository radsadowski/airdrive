name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      # go vet/test only need any file under frontend/dist for the
      # //go:embed pattern to resolve; the real assets are built in release.yml.
      - name: Stub frontend/dist
        run: |
          mkdir -p frontend/dist
          echo '<html><body>ci-stub</body></html>' > frontend/dist/index.html

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Pinned to the version local dev uses; brew latest is a newer major
      # whose goconst/exclusions schema does not match .golangci.yml.
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.11.4

      - name: golangci-lint
        run: golangci-lint run ./...

  test:
    name: Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Stub frontend/dist
        run: |
          mkdir -p frontend/dist
          echo '<html><body>ci-stub</body></html>' > frontend/dist/index.html

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...
